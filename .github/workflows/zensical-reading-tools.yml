name: zensical-reading-tools
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "zensical-reading-tools/**"
      - ".github/workflows/zensical-reading-tools.yml"
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}zensical-reading-tools/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Build
        working-directory: zensical-reading-tools
        run: uv tool run zensical@0.0.73 build --clean --strict
      - name: Stage under its own path
        run: |
          mkdir -p _site
          mv zensical-reading-tools/site _site/zensical-reading-tools
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
